<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo: cuadrado redondeado tipo "app icon" -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>

  <!-- Libro abierto: dos "páginas" en forma de V, trazadas con líneas limpias -->
  <path d="M16 9
           C13.2 7.2 9.6 6.6 7 7.2
           V22.4
           C9.6 21.8 13.2 22.4 16 24.2
           C18.8 22.4 22.4 21.8 25 22.4
           V7.2
           C22.4 6.6 18.8 7.2 16 9
           Z"
        fill="none"
        stroke="#5eead4"
        stroke-width="1.8"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Lomo central del libro -->
  <line x1="16" y1="9" x2="16" y2="24.2"
        stroke="#5eead4"
        stroke-width="1.8"
        stroke-linecap="round"/>
</svg>
